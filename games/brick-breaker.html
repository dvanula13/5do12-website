<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Breaker | 5do12</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=2"></head>
<body data-game="brick-breaker"><div class="wrap"><header class="game-top"><a class="arcade-brand" href="../" aria-label="5do12 home">5do12<span aria-hidden="true">.</span></a><a class="arcade-return" href="./">← All games</a></header>
<h1 class="game-title">Brick Breaker</h1>
<div class="card"><div class="stats">Score <b id="s">0</b> · Lives <b id="l">3</b> · Level <b id="lv">1</b></div>
<canvas id="c" width="400" height="500"></canvas><div class="msg" id="m">Move with mouse/touch or ← →. Click or Space to launch.</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),COL=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let pw=80,px=200,ball,bricks,sc=0,lv=1,lives=3,stuck=true,over=false,keys={},last=performance.now();
function level(){bricks=[];const rows=Math.min(8,3+lv);for(let r=0;r<rows;r++)for(let k=0;k<8;k++)bricks.push({x:4+k*49,y:50+r*20,w:45,h:16,hp:r<lv-1?2:1,c:COL[r%6]});reset()}
function reset(){stuck=true;ball={x:px,y:458,dx:0,dy:0,r:6}}
function launch(){if(over){sc=0;lv=1;lives=3;over=false;upd();level();$('m').textContent='Click or Space to launch.';return}if(!stuck)return;stuck=false;const sp=4+lv*.4,a=-Math.PI/2+(Math.random()-.5)*.8;ball.dx=Math.cos(a)*sp;ball.dy=Math.sin(a)*sp}
function upd(){$('s').textContent=sc;$('l').textContent=lives;$('lv').textContent=lv}
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)*400/r.width});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)*400/r.width;launch()});
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();launch()}});addEventListener('keyup',e=>keys[e.key]=0);
function step(dt){const b=ball;b.x+=b.dx*dt;b.y+=b.dy*dt;
if(b.x<b.r){b.x=b.r;b.dx=Math.abs(b.dx)}if(b.x>400-b.r){b.x=400-b.r;b.dx=-Math.abs(b.dx)}if(b.y<b.r){b.y=b.r;b.dy=Math.abs(b.dy)}
if(b.dy>0&&b.y+b.r>=465&&b.y-b.r<477&&Math.abs(b.x-px)<pw/2+b.r){const h=Math.max(-1,Math.min(1,(b.x-px)/(pw/2))),sp=Math.hypot(b.dx,b.dy),a=-Math.PI/2+h*1.05;b.dx=Math.cos(a)*sp;b.dy=Math.sin(a)*sp;b.y=465-b.r}
for(let i=0;i<bricks.length;i++){const k=bricks[i],nx=Math.max(k.x,Math.min(b.x,k.x+k.w)),ny=Math.max(k.y,Math.min(b.y,k.y+k.h));if(Math.hypot(b.x-nx,b.y-ny)<b.r){
const ox=Math.min(b.x+b.r-k.x,k.x+k.w-(b.x-b.r)),oy=Math.min(b.y+b.r-k.y,k.y+k.h-(b.y-b.r));if(ox<oy)b.dx=-b.dx;else b.dy=-b.dy;
k.hp--;sc+=10;if(k.hp<=0)bricks.splice(i,1);if(Math.hypot(b.dx,b.dy)<9){b.dx*=1.01;b.dy*=1.01}upd();break}}
if(b.y>520){lives--;upd();if(lives<=0){over=true;stuck=true;$('m').textContent=`Game over! Score ${sc}. Click to play again.`}else reset()}
if(!bricks.length){lv++;sc+=100;upd();level()}}
function loop(t){const dt=Math.min(50,t-last)/16;last=t;if(keys.ArrowLeft)px-=8*dt;if(keys.ArrowRight)px+=8*dt;px=Math.max(pw/2,Math.min(400-pw/2,px));
if(stuck&&!over){ball.x=px;ball.y=458}else if(!over)for(let i=0;i<3;i++)step(dt/3);
x.clearRect(0,0,400,500);bricks.forEach(k=>{x.fillStyle=k.c;x.globalAlpha=k.hp>1?1:.85;x.fillRect(k.x,k.y,k.w,k.h);if(k.hp>1){x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(k.x+2,k.y+2,k.w-4,k.h-4)}});x.globalAlpha=1;
x.fillStyle=css('--accent');x.beginPath();x.roundRect(px-pw/2,465,pw,10,5);x.fill();x.fillStyle=css('--ink');x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();requestAnimationFrame(loop)}
level();requestAnimationFrame(loop);
</script>

</div></body></html>
