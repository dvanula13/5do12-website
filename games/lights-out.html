<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lights Out | 5do12</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><header class="game-top"><a class="arcade-brand" href="../" aria-label="5do12 home">5do12<span aria-hidden="true">.</span></a><a class="arcade-return" href="./">← All games</a></header>
<h1 class="game-title">Lights Out</h1>
<style>.l{width:64px;height:64px;margin:0;border-radius:10px;background:var(--line)}.l.on{background:#f5c542;box-shadow:0 0 14px #f5c54288}</style>
<div class="card"><p class="muted">Clicking a light flips it and its neighbors. Turn them all off.</p><div class="stats">Moves <b id="mv">0</b></div>
<div class="grid board board-lights-out" id="g"></div><div class="msg" id="m"></div><button class="alt" id="r">New puzzle</button></div>
<script>
const g=document.getElementById('g'),$=id=>document.getElementById(id);let s,mv,B=[];
for(let i=0;i<25;i++){const b=document.createElement('button');b.className='l';b.onclick=()=>{if(s.every(v=>!v))return;tog(i);mv++;draw()};g.appendChild(b);B.push(b)}
function tog(i){const r=Math.floor(i/5),c=i%5;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,C=c+dc;if(R>=0&&R<5&&C>=0&&C<5)s[R*5+C]^=1})}
function draw(){B.forEach((b,i)=>b.classList.toggle('on',!!s[i]));$('mv').textContent=mv;$('m').textContent=s.every(v=>!v)?`🎉 Solved in ${mv} moves!`:''}
function reset(){s=Array(25).fill(0);for(let k=0;k<10;k++)tog(Math.floor(Math.random()*25));if(s.every(v=>!v))tog(12);mv=0;draw()}
$('r').onclick=reset;reset();
</script>

</div></body></html>
