<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Memory | 5do12</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=2"></head>
<body data-game="number-memory"><div class="wrap"><header class="game-top"><a class="arcade-brand" href="../" aria-label="5do12 home">5do12<span aria-hidden="true">.</span></a><a class="arcade-return" href="./">← All games</a></header>
<h1 class="game-title">Number Memory</h1>
<style>#bar{height:6px;background:var(--accent);border-radius:3px;margin:8px auto;width:0}</style>
<div class="card"><div class="stats">Level <b id="lv">1</b> · Best <b id="b">0</b></div>
<div class="big" id="n" style="font-family:monospace;letter-spacing:4px;min-height:60px">Ready?</div><div id="bar"></div>
<div class="row"><input type="text" id="a" inputmode="numeric" placeholder="type it" style="display:none"></div>
<div class="msg" id="m">Memorize the number, then type it.</div><button id="go">Start</button></div>
<script>
const $=id=>document.getElementById(id);let lv=1,num,best=0,accepting=false;
function show(){num=Array.from({length:lv+2},(_,i)=>i===0?1+Math.floor(Math.random()*9):Math.floor(Math.random()*10)).join('');
$('n').textContent=num;$('a').style.display='none';$('go').style.display='none';$('m').textContent='Memorize...';const ms=1200+num.length*450;
const bar=$('bar');bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${ms}ms linear`;bar.style.width='0';
setTimeout(()=>{$('n').textContent='?'.repeat(num.length);$('a').value='';$('a').style.display='';accepting=true;$('a').focus();$('m').textContent='Type it and press Enter'},ms)}
$('a').onkeydown=e=>{if(e.key!=='Enter'||!accepting)return;accepting=false;$('a').style.display='none';if($('a').value.trim()===num){lv++;$('lv').textContent=lv;if(lv-1>best){best=lv-1;$('b').textContent=best}$('m').textContent='✅ Correct!';setTimeout(show,700)}
else{$('n').textContent=num;$('m').textContent=`❌ You typed ${$('a').value||'nothing'}. Reached level ${lv}.`;lv=1;$('lv').textContent=1;$('a').style.display='none';$('go').style.display='';$('go').textContent='Try again'}};
$('go').onclick=show;
</script>

</div></body></html>
