<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cannon Arc | 5do12</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=2"></head>
<body data-game="cannon-arc"><div class="wrap"><header class="game-top"><a class="arcade-brand" href="../" aria-label="5do12 home">5do12<span aria-hidden="true">.</span></a><a class="arcade-return" href="./">← All games</a></header>
<h1 class="game-title">Cannon Arc</h1>
<style>label{display:inline-flex;align-items:center;gap:6px;margin:4px 10px;font-size:14px}input[type=range]{width:120px}</style>
<div class="card"><div class="stats">Hits <b id="h">0</b> · Shots left <b id="sl">10</b> · Wind <b id="w"></b></div>
<canvas id="c" width="480" height="300"></canvas>
<div class="row"><label>Angle <input type="range" id="ang" min="10" max="80" value="45"><b id="av">45°</b></label><label>Power <input type="range" id="pow" min="20" max="100" value="60"><b id="pv">60</b></label></div>
<div class="msg" id="m">Clear the wall and land on the flag. Watch the wind!</div><button id="fire">🔥 Fire</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),GY=270;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let tx,wall,wind,shot=null,trail=[],old=[],hits=0,left=10;
function setup(){tx=290+Math.random()*160;wall={x:150+Math.random()*60,h:50+Math.random()*110};wind=Math.round((Math.random()-.5)*10)/100;
$('w').textContent=wind===0?'calm':(wind>0?'→ ':'← ')+Math.abs(wind*100).toFixed(0);old=[];draw()}
function draw(){x.clearRect(0,0,480,300);x.fillStyle='#6aa84f';x.fillRect(0,GY,480,30);x.fillStyle='#8a6d55';x.fillRect(wall.x,GY-wall.h,22,wall.h);
x.strokeStyle='#888';x.beginPath();x.moveTo(tx,GY);x.lineTo(tx,GY-34);x.stroke();x.fillStyle='#e74c3c';x.beginPath();x.moveTo(tx,GY-34);x.lineTo(tx+18,GY-28);x.lineTo(tx,GY-22);x.fill();
x.fillStyle='#e74c3c33';x.fillRect(tx-18,GY-3,36,3);
const a=$('ang').value*Math.PI/180;x.save();x.translate(40,GY-10);x.rotate(-a);x.fillStyle=css('--ink');x.fillRect(0,-5,32,10);x.restore();x.fillStyle=css('--ink');x.beginPath();x.arc(40,GY-6,12,0,7);x.fill();
x.fillStyle=css('--muted');old.forEach(p=>x.fillRect(p[0],p[1],2,2));x.fillStyle=css('--accent2');trail.forEach(p=>x.fillRect(p[0]-1,p[1]-1,3,3));
if(shot){x.fillStyle=css('--ink');x.beginPath();x.arc(shot.x,shot.y,5,0,7);x.fill()}}
['ang','pow'].forEach(id=>$(id).oninput=()=>{$('av').textContent=$('ang').value+'°';$('pv').textContent=$('pow').value;if(!shot)draw()});
function fire(){if(shot)return;if(left===0){restart();return}left--;$('sl').textContent=left;const a=$('ang').value*Math.PI/180,p=$('pow').value*.12;
shot={x:40+Math.cos(a)*32,y:GY-10-Math.sin(a)*32,vx:Math.cos(a)*p,vy:-Math.sin(a)*p};trail=[];$('fire').disabled=true;requestAnimationFrame(fly)}
$('fire').onclick=fire;
function fly(){for(let i=0;i<2;i++){shot.vy+=.075;shot.vx+=wind*.5;shot.x+=shot.vx*.5;shot.y+=shot.vy*.5}trail.push([shot.x,shot.y]);let res=null;
if(shot.x>wall.x-4&&shot.x<wall.x+26&&shot.y>GY-wall.h-4)res='wall';else if(shot.y>=GY)res=Math.abs(shot.x-tx)<20?'hit':'miss';else if(shot.x>500||shot.x<-20)res='miss';
draw();if(!res){requestAnimationFrame(fly);return}
old=trail;shot=null;if(res==='hit'){hits++;$('h').textContent=hits;$('m').textContent='🎯 Direct hit! New target.';if(left>0){setTimeout(()=>{setup();$('fire').disabled=false},700);return}}else $('m').textContent=res==='wall'?'🧱 Hit the wall.':'Missed by '+Math.round(Math.abs(trail.at(-1)[0]-tx))+'px';
draw();if(left<=0){$('m').textContent+=` Out of shots — ${hits} hits! Press Fire to restart.`;$('fire').disabled=false;$('fire').textContent='Play again'}else $('fire').disabled=false}
function restart(){hits=0;left=10;$('h').textContent=0;$('sl').textContent=10;$('fire').textContent='🔥 Fire';$('m').textContent='New round!';setup()}
setup();
</script>

</div></body></html>
