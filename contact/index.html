<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action https://formsubmit.co https://5do12.de">
  <meta name="theme-color" content="#080e1a">
  <title>Project Enquiry | 5do12</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v=20261123-games">
  <link rel="stylesheet" href="contact.css">
  <script src="contact.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="contact-header wrap">
    <a class="brand" href="../" aria-label="5do12 home"><span class="brand-mark" aria-hidden="true"></span><span>5do12<span class="brand-dot">.</span></span></a>
    <a href="../services/">Service catalog</a>
  </header>
  <main id="main" class="contact-main wrap">
    <h1>Project enquiry</h1>
    <p class="contact-intro">Tell us what you need and where we can reach you.</p>
    <form class="contact-form" method="post" action="https://formsubmit.co/republikaborovo@gmail.com">
      <input type="hidden" name="_subject" value="New 5do12 project enquiry">
      <input type="hidden" name="_next" value="https://5do12.de/contact/thanks.html">
      <input type="hidden" name="_url" value="https://5do12.de/contact/">
      <input type="hidden" name="_template" value="table">
      <div class="contact-trap" hidden><input name="_honey" type="text" tabindex="-1" autocomplete="off" aria-label="Leave this field empty"></div>
      <div class="contact-fields">
        <div class="contact-field">
          <label for="contact-name">Your name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="120">
        </div>
        <div class="contact-field">
          <label for="contact-email">Email address</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="contact-field">
          <label for="contact-company">Company <span>(optional)</span></label>
          <input id="contact-company" name="company" type="text" autocomplete="organization" maxlength="160">
        </div>
        <div class="contact-field">
          <label for="contact-language">Preferred reply language <span>(optional)</span></label>
          <select id="contact-language" name="language">
            <option value="">No preference</option>
            <option>English</option><option>Croatian</option><option>German</option><option>Serbian</option><option>Bosnian</option>
          </select>
        </div>
        <div class="contact-field contact-wide">
          <label for="contact-service">What are you interested in?</label>
          <select id="contact-service" name="service">
            <option value="General project enquiry">General project enquiry</option>
            <optgroup label="Websites &amp; marketing">
              <option value="Small business websites" data-offer="WEB-01">Small business websites</option>
              <option value="Website maintenance" data-offer="WEB-02">Website maintenance</option>
              <option value="Website monitoring" data-offer="WEB-03">Website monitoring</option>
              <option value="Digital QR menus" data-offer="WEB-04">Digital QR menus</option>
              <option value="Website lead checks" data-offer="WEB-05">Website lead checks</option>
            </optgroup>
            <optgroup label="Booking &amp; business operations">
              <option value="Online Appointment Booking" data-offer="OPS-01">Online Appointment Booking</option>
              <option value="Invoicing and quotes" data-offer="OPS-02">Invoicing and quotes</option>
              <option value="Driving school scheduling" data-offer="OPS-03">Driving school scheduling</option>
              <option value="Farm records and alerts" data-offer="OPS-04">Farm records and alerts</option>
              <option value="Construction site diary" data-offer="OPS-05">Construction site diary</option>
              <option value="Accounting document portal" data-offer="OPS-06">Accounting document portal</option>
              <option value="Quote follow-up" data-offer="OPS-07">Quote follow-up</option>
              <option value="Extra-work approvals" data-offer="OPS-08">Extra-work approvals</option>
            </optgroup>
            <optgroup label="AI &amp; automation">
              <option value="AI website support" data-offer="AI-01">AI website support</option>
              <option value="Catalog descriptions and translation" data-offer="AI-02">Catalog descriptions and translation</option>
              <option value="Document extraction" data-offer="AI-03">Document extraction</option>
              <option value="Meeting notes" data-offer="AI-04">Meeting notes</option>
              <option value="Business workflow automation" data-offer="AI-05">Business workflow automation</option>
            </optgroup>
            <optgroup label="E-commerce">
              <option value="Shopify app or WordPress plugin" data-offer="EC-01">Shopify app or WordPress plugin</option>
              <option value="Cash-on-delivery payout matching" data-offer="EC-02">Cash-on-delivery payout matching</option>
            </optgroup>
            <optgroup label="IT &amp; hardware">
              <option value="Small office IT setup" data-offer="IT-01">Small office IT setup</option>
              <option value="Refurbished device sourcing" data-offer="IT-02">Refurbished device sourcing</option>
              <option value="Custom PC builds" data-offer="IT-03">Custom PC builds</option>
              <option value="Smart home installation" data-offer="IT-04">Smart home installation</option>
              <option value="Environmental monitoring" data-offer="IT-05">Environmental monitoring</option>
            </optgroup>
            <optgroup label="Templates &amp; training">
              <option value="SaaS starter kit" data-offer="DIG-01">SaaS starter kit</option>
              <option value="Business templates" data-offer="DIG-02">Business templates</option>
              <option value="Online course or workshop" data-offer="DIG-03">Online course or workshop</option>
            </optgroup>
          </select>
        </div>
        <div class="contact-field contact-wide">
          <label for="contact-message">Tell us about your project</label>
          <textarea id="contact-message" name="message" rows="10" required maxlength="6000" placeholder="What are you trying to do? Include any timing or requirements you already know."></textarea>
        </div>
      </div>
      <div class="contact-actions">
        <p>FormSubmit forwards your enquiry to 5do12 by email. <a href="../datenschutz.html#projektanfragen">Privacy information</a></p>
        <button type="submit" class="button">Send enquiry</button>
      </div>
    </form>
    <p class="contact-direct">You can also email us at <a href="mailto:republikaborovo@gmail.com">republikaborovo@gmail.com</a>.</p>
  </main>
  <footer class="site-footer contact-footer wrap">
    <p>5do12 · Public preview</p>
    <nav aria-label="Website information">
      <a href="../impressum.html" lang="de">Impressum</a>
      <a href="../datenschutz.html" lang="de">Datenschutz</a>
    </nav>
  </footer>
</body>
</html>
